name: Android Release Google Play

# Manual dispatch only. Builds the selected flavor via the existing Fastlane
# lane `fastlane android <env>` (see fastlane/Fastfile) and uploads the AAB to
# the selected Google Play track. The GitHub Environment matching `env`
# supplies the secrets, so give the `production` environment required reviewers.
on:
  workflow_dispatch:
    inputs:
      env:
        description: App environment (flavor)
        type: choice
        options: [staging, production]
        default: staging
      track:
        description: Google Play track
        type: choice
        options: [internal, alpha, beta, production]
        default: internal

concurrency:
  group: android-release-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build ${{ inputs.env }} & upload to Google Play (${{ inputs.track }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.env }}
    env:
      ENVFILE: .env.${{ inputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'
          cache: gradle

      - name: Setup Ruby (bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true

      - name: Tune Gradle for CI
        # ~/.gradle/gradle.properties overrides android/gradle.properties (-Xmx2048m),
        # so this only affects CI. GitHub's Linux runners have 16 GB RAM.
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> ~/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> ~/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> ~/.gradle/gradle.properties

      - name: Install ccache
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ccache

      - name: Restore ccache
        # Native (C++) objects from earlier runs. A new key every run so the cache is
        # always saved; restore-keys picks up the most recent one.
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-android-${{ runner.os }}-${{ github.run_id }}
          restore-keys: ccache-android-${{ runner.os }}-

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn format:check

      - name: Lint
        run: yarn lint

      - name: Typecheck
        run: yarn typecheck

      - name: Test
        run: yarn test --ci

      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=()
          for var_name in APP_ENV_FILE ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PLAY_STORE_JSON_KEY_BASE64; do
            if [ -z "${!var_name:-}" ]; then
              missing+=("$var_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets in the '${{ inputs.env }}' environment:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required secrets are present."
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}

      - name: Materialize env file
        # The whole .env.<env> file is stored as the APP_ENV_FILE secret of the
        # matching GitHub Environment (update it with `yarn env:push:<env>`).
        # Everything in it is bundled into the app by react-native-config, so it
        # must never contain signing passwords or other credentials.
        # The versionCode is not taken from this file: fastlane uses the highest
        # version code on Google Play + 1 (see next_android_version_code).
        run: |
          set -euo pipefail
          printf '%s\n' "$APP_ENV_FILE" | tr -d '\r' > "$ENVFILE"
          for key in APP_ENV API_BASE_URL ANDROID_BUNDLE_ID ANDROID_APP_VERSION_NAME ANDROID_APP_VERSION_CODE APP_NAME; do
            if ! grep -q "^${key}=" "$ENVFILE"; then
              echo "Missing ${key} in APP_ENV_FILE for '${{ inputs.env }}'." >&2
              exit 1
            fi
          done
          app_env="$(grep '^APP_ENV=' "$ENVFILE" | cut -d= -f2-)"
          api_base_url="$(grep '^API_BASE_URL=' "$ENVFILE" | cut -d= -f2-)"
          if [ "$app_env" != "${{ inputs.env }}" ]; then
            echo "APP_ENV in APP_ENV_FILE must match '${{ inputs.env }}'." >&2
            exit 1
          fi
          case "$api_base_url" in
            https://*) ;;
            *) echo "API_BASE_URL in APP_ENV_FILE must be an HTTPS URL." >&2; exit 1 ;;
          esac
          echo "Package: $(grep '^ANDROID_BUNDLE_ID=' "$ENVFILE" | cut -d= -f2-)"
          echo "Version name: $(grep '^ANDROID_APP_VERSION_NAME=' "$ENVFILE" | cut -d= -f2-)"
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}

      - name: Materialize Android signing files
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/lingobites-android-signing"
          mkdir -p "$signing_dir"

          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_dir/upload.jks"
          printf '%s' "$PLAY_STORE_JSON_KEY_BASE64" | base64 --decode > "$signing_dir/play-service-account.json"

          test -s "$signing_dir/upload.jks"
          test -s "$signing_dir/play-service-account.json"

          printf 'ANDROID_KEYSTORE_FILE=%s\n' "$signing_dir/upload.jks" >> "$GITHUB_ENV"
          printf 'PLAY_STORE_JSON_KEY_FILE=%s\n' "$signing_dir/play-service-account.json" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_STORE_JSON_KEY_BASE64: ${{ secrets.PLAY_STORE_JSON_KEY_BASE64 }}

      - name: Print expo-updates fingerprint
        # The runtime version this build embeds. An EAS update reaches it only
        # when `eas update` prints the same runtime version for android.
        run: |
          set -euo pipefail
          fingerprint="$(npx expo-updates fingerprint:generate --platform android | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).hash))')"
          echo "Android runtime version (fingerprint): $fingerprint"
          echo "Android runtime version (fingerprint): \`$fingerprint\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Build and upload to Google Play (fastlane android ${{ inputs.env }})
        run: bundle exec fastlane android ${{ inputs.env }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PLAY_STORE_TRACK: ${{ inputs.track }}
          PLAY_STORE_RELEASE_STATUS: completed
          # CMake (>= 3.17) reads these from the environment, so every native module
          # built by the NDK compiles through ccache.
          CMAKE_C_COMPILER_LAUNCHER: ccache
          CMAKE_CXX_COMPILER_LAUNCHER: ccache
          CCACHE_BASEDIR: ${{ github.workspace }}
          CCACHE_NOHASHDIR: 'true'
          CCACHE_COMPRESS: 'true'
          CCACHE_MAXSIZE: 2G
          # Codegen headers are regenerated each build, so ignore their timestamps.
          CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros

      - name: Show ccache stats
        if: always()
        run: ccache -s || true

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: lingobites-${{ inputs.env }}-${{ github.run_number }}-aab
          path: android/app/build/outputs/bundle/${{ inputs.env }}Release/*.aab
          retention-days: 14

      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$ENVFILE"
          rm -rf "$RUNNER_TEMP/lingobites-android-signing"
