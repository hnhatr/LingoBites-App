name: iOS Release TestFlight

# Manual dispatch only. Builds the selected scheme via the existing Fastlane
# lane `fastlane ios <env>` (see fastlane/Fastfile) and uploads to TestFlight.
# The GitHub Environment matching `env` supplies the secrets (including the
# whole .env.<env> file as APP_ENV_FILE), so give the `production` environment
# required reviewers.
on:
  workflow_dispatch:
    inputs:
      env:
        description: App environment (scheme)
        type: choice
        options: [staging, production]
        default: staging

concurrency:
  group: ios-release-${{ inputs.env }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-upload:
    name: Build ${{ inputs.env }} & upload to TestFlight
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ${{ inputs.env }}
    env:
      ENVFILE: .env.${{ inputs.env }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve scheme for environment
        run: |
          set -euo pipefail
          case "${{ inputs.env }}" in
            staging)    scheme=Staging;    configuration=ReleaseStag ;;
            production) scheme=Production; configuration=ReleaseProd ;;
            *) echo "Unknown env: ${{ inputs.env }}" >&2; exit 1 ;;
          esac
          printf 'IOS_SCHEME=%s\n' "$scheme" >> "$GITHUB_ENV"
          printf 'IOS_CONFIGURATION=%s\n' "$configuration" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Ruby (bundler)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.4'
          bundler-cache: true

      - name: Install JS dependencies
        run: yarn install --frozen-lockfile

      - name: Install Ruby gems
        run: bundle install

      - name: Install CocoaPods
        run: bundle exec pod install --project-directory=ios

      - name: Lint
        run: yarn lint

      - name: Check lint warning budget
        run: yarn lint:budget

      - name: Typecheck
        run: yarn typecheck

      - name: Check formatting
        run: yarn format:check

      - name: Test
        run: yarn test --passWithNoTests

      - name: Verify required secrets are present
        run: |
          set -euo pipefail
          missing=()
          for var_name in APP_ENV_FILE APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_API_KEY IOS_DEVELOPMENT_TEAM IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64; do
            if [ -z "${!var_name:-}" ]; then
              missing+=("$var_name")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required secrets in the '${{ inputs.env }}' environment:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "All required secrets are present."
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Materialize env file
        # The whole .env.<env> file is stored as the APP_ENV_FILE secret of the
        # matching GitHub Environment (update it with `yarn env:push:<env>`).
        # Everything in it is bundled into the app by react-native-config, so it
        # must never contain signing material or other credentials; those stay
        # in their own secrets.* and are never written to this file.
        run: |
          set -euo pipefail
          printf '%s\n' "$APP_ENV_FILE" | tr -d '\r' > "$ENVFILE"
          for key in IOS_BUNDLE_ID IOS_APP_VERSION_NAME APP_NAME; do
            if ! grep -q "^${key}=" "$ENVFILE"; then
              echo "Missing ${key} in APP_ENV_FILE for '${{ inputs.env }}'." >&2
              exit 1
            fi
          done
          bundle_id="$(grep '^IOS_BUNDLE_ID=' "$ENVFILE" | cut -d= -f2-)"
          echo "Bundle id: $bundle_id"
          printf 'EXPECTED_IOS_BUNDLE_ID=%s\n' "$bundle_id" >> "$GITHUB_ENV"
        env:
          APP_ENV_FILE: ${{ secrets.APP_ENV_FILE }}

      - name: Generate Xcode build config from env file
        run: |
          set -euo pipefail
          ruby ./node_modules/react-native-config/ios/ReactNativeConfig/BuildXCConfig.rb . ios/tmp.xcconfig

      - name: Preflight - assert resolved bundle id matches env file
        run: |
          set -euo pipefail
          resolved="$(xcodebuild -workspace ios/LingoBites.xcworkspace -scheme "$IOS_SCHEME" -configuration "$IOS_CONFIGURATION" -showBuildSettings 2>/dev/null | awk -F ' = ' '$1 ~ /^[[:space:]]*PRODUCT_BUNDLE_IDENTIFIER$/ {print $2}')"
          echo "Resolved bundle id: $resolved"
          if [ "$resolved" != "$EXPECTED_IOS_BUNDLE_ID" ]; then
            echo "Resolved bundle id '$resolved' does not match IOS_BUNDLE_ID '$EXPECTED_IOS_BUNDLE_ID' from APP_ENV_FILE. Aborting." >&2
            exit 1
          fi
          if [ "${{ inputs.env }}" = "staging" ]; then
            case "$resolved" in
              *prod*|*Production*)
                echo "Resolved bundle id '$resolved' looks like a production identifier for a staging build. Aborting." >&2
                exit 1
                ;;
            esac
          fi

      - name: Materialize iOS signing files
        run: |
          set -euo pipefail
          umask 077
          signing_dir="$RUNNER_TEMP/lingobites-signing"
          certificate_path="$RUNNER_TEMP/lingobites-signing/distribution.p12"
          profile_path="$RUNNER_TEMP/lingobites-signing/app-store.mobileprovision"
          mkdir -p "$signing_dir"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"

          test -s "$certificate_path"
          test -s "$profile_path"
          security cms -D -i "$profile_path" >/dev/null

          printf 'IOS_DISTRIBUTION_CERTIFICATE_PATH=%s\n' "$certificate_path" >> "$GITHUB_ENV"
          printf 'IOS_PROVISIONING_PROFILE_PATH=%s\n' "$profile_path" >> "$GITHUB_ENV"
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}

      - name: Build and upload to TestFlight (fastlane ios ${{ inputs.env }})
        run: bundle exec fastlane ios ${{ inputs.env }}
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.IOS_APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.IOS_APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.IOS_APP_STORE_CONNECT_API_KEY }}
          IOS_DEVELOPMENT_TEAM: ${{ secrets.IOS_DEVELOPMENT_TEAM }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.IOS_APPLE_ID }}
          APP_STORE_CONNECT_TEAM_ID: ${{ secrets.IOS_APP_STORE_CONNECT_TEAM_ID }}

      - name: Cleanup signing material
        if: always()
        run: |
          set -euo pipefail
          rm -f "$ENVFILE" ios/tmp.xcconfig ios/.xcode.env.local
          rm -f "$RUNNER_TEMP/lingobites-signing/distribution.p12"
          rm -f "$RUNNER_TEMP/lingobites-signing/app-store.mobileprovision"
          rmdir "$RUNNER_TEMP/lingobites-signing" 2>/dev/null || true
          if security list-keychains | grep -q fastlane_tmp_keychain; then
            security delete-keychain fastlane_tmp_keychain || true
          fi
