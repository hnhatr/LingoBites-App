    /* OD-LAYOUT-PRIMITIVES v1 — structure only: display, flex/grid, overflow, wrapping, ratio.
       Product CSS outside the layer always wins. */
    @layer od-layout {
      :where(.od-stack,.od-row,.od-row-top,.od-cluster,.od-grid,.od-field,.od-stat,.od-cell,.od-tile) > :where(*) { min-width: 0; }
      .od-stack { display:flex; flex-direction:column; gap:var(--od-gap,8px); }
      .od-row { display:flex; align-items:center; gap:var(--od-gap,8px); }
      .od-row-top { display:flex; align-items:flex-start; gap:var(--od-gap,8px); }
      .od-cluster { display:flex; flex-wrap:wrap; align-items:center; gap:var(--od-gap,8px); }
      .od-fill { flex:1 1 0; min-width:0; }
      .od-fixed { flex:none; }
      .od-grid { display:grid; gap:var(--od-gap,12px); grid-template-columns:repeat(var(--od-cols,3),minmax(0,1fr)); }
      .od-stat,.od-field,.od-cell { display:grid; gap:var(--od-gap,2px); }
      :where(.od-stat,.od-field,.od-cell)>:where(*) { display:block; }
      .od-tile { display:grid; grid-template-rows:auto 1fr; }
      :where(.od-tile)>:where(*) { display:block; }
      .od-media { display:block; width:100%; height:auto; aspect-ratio:var(--od-ratio,auto); }
      .od-media-cover { object-fit:cover; }
      .od-truncate { display:block; max-width:100%; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
      .od-clamp-2,.od-clamp-3 { display:-webkit-box; -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
      .od-clamp-2 { -webkit-line-clamp:2; }
      .od-clamp-3 { -webkit-line-clamp:3; }
      .od-lines-2 { min-height:calc(2 * 1.4em); }
      .od-nowrap { white-space:nowrap; }
      .od-keep { word-break:keep-all; overflow-wrap:anywhere; }
      .od-screen { display:grid; grid-template-rows:auto minmax(0,1fr) auto; height:100%; }
      .od-scroll { overflow-y:auto; overscroll-behavior:contain; min-height:0; }
      .od-rail { display:flex; gap:var(--od-gap,8px); overflow-x:auto; scroll-snap-type:x proximity; scrollbar-width:none; padding-inline:var(--od-rail-pad,16px); scroll-padding-inline:var(--od-rail-pad,16px); }
      .od-rail::-webkit-scrollbar { display:none; }
      :where(.od-rail)>:where(*) { flex:none; scroll-snap-align:start; }
      :where(.od-rail)>:where(:last-child) { margin-inline-end:var(--od-rail-pad,16px); }
      .od-spacer { flex:none; visibility:hidden; pointer-events:none; }
      .od-touch { min-width:44px; min-height:44px; }
    }
    /* /OD-LAYOUT-PRIMITIVES v1 */

    .theme-swatch { min-height:78px; padding:8px; border:1px solid var(--line); border-radius:14px; background:var(--surface); cursor:pointer; }
    .theme-swatch.selected { outline:3px solid var(--primary); outline-offset:2px; }
    .theme-colors { display:grid; grid-template-columns:1.2fr 1fr .7fr; height:30px; overflow:hidden; border-radius:9px; }
    .theme-swatch span { display:block; margin-top:7px; font-size:12px; font-weight:800; }
    .setting-row { min-height:58px; padding:6px 0; border-bottom:1px solid var(--line); }
    .setting-row:last-child { border-bottom:0; }

    .settings-heading { padding:18px 16px 14px; border-bottom:1px solid var(--line); background:var(--surface-soft); }

    .settings-list .setting-row > svg { flex:none; width:20px; height:20px; color:var(--muted); }
    .toggle { position:relative; width:48px; height:28px; border:0; border-radius:99px; background:var(--line); cursor:pointer; }
    .toggle::after { content:""; position:absolute; top:4px; left:4px; width:20px; height:20px; border-radius:50%; background:white; box-shadow:0 2px 5px rgba(0,0,0,.2); transition:transform var(--fast) var(--ease); }
    .toggle[aria-pressed="true"] { background:var(--secondary); }
    .toggle[aria-pressed="true"]::after { transform:translateX(20px); }
    .toast { position:absolute; z-index:50; left:16px; right:16px; bottom:94px; display:flex; align-items:center; gap:10px; min-height:52px; padding:12px 14px; border-radius:15px; background:var(--ink); color:var(--bg); box-shadow:0 12px 30px rgba(0,0,0,.24); animation:toast-in var(--normal) var(--ease); }
    .toast svg { flex:none; width:22px; height:22px; color:var(--accent); }
    @keyframes toast-in { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:none} }
    .loading-line { height:6px; overflow:hidden; border-radius:99px; background:var(--surface-soft); }
    .loading-line span { display:block; height:100%; width:45%; border-radius:inherit; background:var(--primary); animation:load 1s ease-in-out infinite alternate; }
    @keyframes load { to{transform:translateX(125%)} }
    .success-view { display:grid; place-items:center; min-height:420px; text-align:center; }
    .success-badge { display:grid; place-items:center; width:92px; height:92px; border-radius:32px; background:var(--surface-soft); color:var(--success); }
    .success-badge svg { width:52px; height:52px; }
    .success-view p { max-width:270px; color:var(--muted); }

    html[data-style="paper"] h1,html[data-style="paper"] h2,html[data-style="paper"] h3 { font-weight:900; letter-spacing:-.025em; }
    html[data-style="paper"] .hero::before,html[data-style="paper"] .hero::after { content:""; position:absolute; pointer-events:none; }
    html[data-style="paper"] .hero::before { width:112px; height:112px; right:-22px; top:-30px; border-radius:28px 52px 34px 46px; background:#ff766d; transform:rotate(13deg); opacity:.9; }
    html[data-style="paper"] .hero::after { width:78px; height:48px; left:-18px; bottom:-24px; border-radius:22px 38px 18px 32px; background:#79d6b4; transform:rotate(-8deg); }
    html[data-style="paper"] .source-card,html[data-style="paper"] .progress-card,html[data-style="paper"] .lesson-card,html[data-style="paper"] .form-card,html[data-style="paper"] .profile-card,html[data-style="paper"] .practice-card,html[data-style="paper"] .library-item { border-width:2px; box-shadow:var(--shadow-soft); }
    html[data-style="paper"] .source-icon { border-width:2px; box-shadow:3px 3px 0 color-mix(in srgb,currentColor 18%,transparent); }
    html[data-style="paper"] .button { border:2px solid color-mix(in srgb,var(--accent-ink) 24%,transparent); box-shadow:0 4px 0 rgba(24,49,83,.24); }
    html[data-style="paper"] .tab-btn.active { outline:2px solid color-mix(in srgb,var(--primary) 25%,transparent); box-shadow:0 3px 0 color-mix(in srgb,var(--primary) 15%,transparent); }
    html[data-style="paper"] .tag { border:1px solid color-mix(in srgb,currentColor 18%,transparent); }

    html[data-style="garden"] body { font-weight:520; }
    html[data-style="garden"] h1,html[data-style="garden"] h2,html[data-style="garden"] h3 { font-weight:800; letter-spacing:-.01em; }
    html[data-style="garden"] .hero { box-shadow:var(--shadow); }
    html[data-style="garden"] .hero::before,html[data-style="garden"] .hero::after { content:""; position:absolute; pointer-events:none; background:#b7e3cd; opacity:.48; }
    html[data-style="garden"] .hero::before { width:118px; height:58px; right:-25px; top:16px; border-radius:100% 0 100% 0; transform:rotate(-18deg); }
    html[data-style="garden"] .hero::after { width:90px; height:44px; left:-30px; bottom:4px; border-radius:0 100% 0 100%; transform:rotate(14deg); }
    html[data-style="garden"] .source-card,html[data-style="garden"] .progress-card,html[data-style="garden"] .lesson-card,html[data-style="garden"] .form-card,html[data-style="garden"] .profile-card,html[data-style="garden"] .practice-card,html[data-style="garden"] .library-item { border-color:color-mix(in srgb,var(--line) 78%,transparent); box-shadow:var(--shadow-soft); }
    html[data-style="garden"] .source-icon,html[data-style="garden"] .lesson-thumb,html[data-style="garden"] .library-item .thumb { border-radius:18px 10px 18px 10px; }
    html[data-style="garden"] .button { box-shadow:none; }
    html[data-style="garden"] .tab-btn.active { border-radius:18px 10px 18px 10px; }
    html[data-style="garden"] .tag { border-radius:10px 18px 10px 18px; }
    html[data-style="garden"] .mascot path[fill="#ffd65a"] { fill:#e8bf52; }
    html[data-style="garden"] .mascot path[fill="#4faee3"] { fill:#5aa795; }

    html[data-style="comic"] body { font-weight:600; }
    html[data-style="comic"] h1,html[data-style="comic"] h2,html[data-style="comic"] h3 { font-weight:900; letter-spacing:-.035em; }
    html[data-style="comic"] .hero { overflow:hidden; border:2px solid var(--ink); box-shadow:var(--shadow); }
    html[data-style="comic"] .hero::before { content:""; position:absolute; right:-24px; top:-24px; width:116px; height:116px; background:var(--accent); clip-path:polygon(50% 0,61% 33%,88% 12%,72% 42%,100% 50%,70% 59%,89% 88%,60% 69%,50% 100%,41% 68%,12% 88%,30% 59%,0 50%,31% 41%,12% 12%,40% 32%); transform:rotate(8deg); }
    html[data-style="comic"] .hero::after { content:"••••••\A••••••\A••••••"; position:absolute; left:12px; bottom:8px; white-space:pre; color:var(--accent); font-size:13px; line-height:.72; letter-spacing:4px; opacity:.72; transform:rotate(-8deg); }
    html[data-style="comic"] .source-card,html[data-style="comic"] .progress-card,html[data-style="comic"] .lesson-card,html[data-style="comic"] .form-card,html[data-style="comic"] .profile-card,html[data-style="comic"] .practice-card,html[data-style="comic"] .library-item { border:2px solid var(--ink); border-radius:var(--r-md); box-shadow:var(--shadow-soft); }
    html[data-style="comic"] .source-icon,html[data-style="comic"] .lesson-thumb,html[data-style="comic"] .library-item .thumb,html[data-style="comic"] .avatar { border:2px solid var(--ink); border-radius:10px; box-shadow:3px 3px 0 var(--ink); }
    html[data-style="comic"] .source-card:nth-child(2n) .source-icon { transform:rotate(3deg); }
    html[data-style="comic"] .source-card:nth-child(2n+1) .source-icon { transform:rotate(-3deg); }
    html[data-style="comic"] .button { border:2px solid var(--ink); border-radius:10px; box-shadow:3px 3px 0 var(--ink); }
    html[data-style="comic"] .button.primary { border-color:var(--ink); box-shadow:3px 3px 0 var(--ink); }
    html[data-style="comic"] .tag { border:2px solid var(--ink); border-radius:9px 9px 9px 3px; box-shadow:2px 2px 0 color-mix(in srgb,var(--ink) 28%,transparent); font-weight:900; }
    html[data-style="comic"] .tab-btn.active { border:2px solid var(--ink); border-radius:10px; box-shadow:3px 3px 0 var(--ink); }
    html[data-style="comic"] .tab-btn.active::after { width:20px; height:4px; border-radius:2px; }
    html[data-style="comic"] .settings-heading { border-bottom:2px solid var(--ink); background:var(--accent); color:var(--accent-ink); }
    html[data-style="comic"] .settings-heading .eyebrow { color:var(--accent-ink); }
    html[data-style="comic"] .word-chip,html[data-style="comic"] .quiz-option,html[data-style="comic"] .choice-card,html[data-style="comic"] .filter-chip { border:2px solid var(--ink); border-radius:10px; }
    button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
    @media (hover:hover) { button:hover,a:hover { transform:translateY(-2px); } .source-card:hover { border-color:var(--primary); } }
    @media (max-height:927px) { .phone-frame { zoom:.9; } }
    @media (max-height:840px) { .phone-frame { zoom:.82; } }
    @media (max-height:771px) { .phone-frame { zoom:.74; } }
    @media (max-height:702px) { .phone-frame { zoom:.66; } }
    @media (max-width:480px) { body{padding:0;display:block;background:var(--bg)} .phone-frame{width:100%;height:100dvh;padding:0;border-radius:0;background:none;box-shadow:none;zoom:1} .phone-frame::before,.phone-frame::after,.hardware-button{display:none}.phone-screen{width:100%;height:100%;border-radius:0} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation-duration:.01ms!important; animation-iteration-count:1!important; scroll-behavior:auto!important; transition-duration:.01ms!important; } }

<body>
  <div class="phone-frame" data-phone-shell data-platform="neutral">
    <span class="hardware-button volume" aria-hidden="true"></span>
    <span class="hardware-button power" aria-hidden="true"></span>
    <section class="phone-screen" data-phone-screen>
      <main class="phone-content" data-phone-content>
        <!-- APP CONTENT START -->
        <div id="app"></div>
        <!-- APP CONTENT END -->
      </main>
      <div class="status-bar" aria-hidden="true">
        <span class="status-time">9:41</span><span class="status-cutout-zone"></span>
        <span class="status-icons">
          <svg class="connectivity" viewBox="0 0 15 12"><path d="M1.5 10.5v-2m4 2v-4.5m4 4.5v-7m4 7v-9"/></svg>
          <svg class="wifi" viewBox="0 0 16 12"><path d="M1.5 4.7a9.2 9.2 0 0 1 13 0M4.2 7.3a5.4 5.4 0 0 1 7.6 0M6.9 10a1.55 1.55 0 0 1 2.2 0"/></svg>
          <svg class="battery" viewBox="0 0 20 11"><rect x=".75" y="1.25" width="16.5" height="8.5" rx="2"/><path d="M18.5 4v3M3.2 3.4h10.4v4.2H3.2z" fill="currentColor" stroke="none"/></svg>
        </span>
      </div>
      <div class="camera-dot" aria-hidden="true"></div>
      <div class="gesture-indicator" aria-hidden="true"></div>
    </section>
  </div>
  <script>
    const app = document.getElementById('app');
    const icons = {
      cat:'<path d="M8 6 5 3 4 9a7 7 0 1 0 16 0l-1-6-3 3"/><path d="M8 13h.01M16 13h.01M9 17c2 1 4 1 6 0"/>',
      home:'<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',
      plus:'<path d="M12 5v14M5 12h14"/>', book:'<path d="M4 5a3 3 0 0 1 3-3h13v17H7a3 3 0 0 0-3 3Z"/><path d="M4 5v17M8 6h8"/>',
      user:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',
      video:'<rect x="3" y="5" width="14" height="14" rx="3"/><path d="m17 10 4-2v8l-4-2z"/><path d="m9 9 4 3-4 3z"/>',
      news:'<path d="M5 3h14v18H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2Z"/><path d="M8 7h8M8 11h8M8 15h5"/>',
      offline:'<path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M5 19h14"/>', practice:'<path d="M9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>',
      flame:'<path d="M12 22c4 0 7-3 7-7 0-5-4-7-3-12-4 2-7 6-7 10-1-1-2-3-2-5-2 2-3 4-3 7 0 4 4 7 8 7Z"/>',
      arrow:'<path d="m15 18-6-6 6-6"/>', play:'<path d="m9 7 9 5-9 5z"/>', pause:'<path d="M9 7v10M15 7v10"/>',
      volume:'<path d="M11 5 6 9H3v6h3l5 4zM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12"/>',
      check:'<path d="m5 12 4 4L19 6"/>', download:'<path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/>', cloud:'<path d="M17.5 19H6a4 4 0 0 1-.4-8A6 6 0 0 1 17 8a4.5 4.5 0 0 1 .5 11Z"/>',
      chevron:'<path d="m9 18 6-6-6-6"/>', palette:'<path d="M12 3a9 9 0 0 0 0 18h1.5a2 2 0 0 0 0-4H12a2 2 0 0 1 0-4h5a4 4 0 0 0 4-4c0-3-4-6-9-6Z"/><circle cx="7.5" cy="10" r=".7" fill="currentColor"/><circle cx="9" cy="6.5" r=".7" fill="currentColor"/><circle cx="14" cy="6" r=".7" fill="currentColor"/>'
    };
    const icon = (name,label='') => `<svg ${label?`aria-label="${label}" role="img"`:'aria-hidden="true"'} viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
    const mascot = () => `<svg class="mascot" viewBox="0 0 130 140" aria-label="Mèo hướng dẫn đang cầm sách" role="img"><g fill="none" stroke="#153143" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path class="tail" d="M94 90c28 3 31 26 10 29"/><path fill="#ffd65a" d="m44 39-8-21 19 12c9-5 22-4 31 2l20-11-7 24c7 12 7 28 0 40-9 16-37 20-53 7-16-13-17-38-2-53Z"/><path fill="#fff" d="M42 89c12-8 42-7 57 3l-5 37H48Z"/><path fill="#4faee3" d="M44 94c13-7 42-6 55 1l-4 28c-16-5-29-4-47 0Z"/><path d="M55 58h.1M88 58h.1M63 72c6 4 12 4 18 0"/><path d="m69 64 3 2 3-2M57 47l7-4M86 46l-7-3"/><path fill="#fff" d="m50 96-18-8 5 34 16 7ZM96 96l18-8-4 34-16 7Z"/></g></svg>`;

    const state = {
      route:'home', previous:'home', theme:localStorage.getItem('lingomeo-theme')||'sunshine',
      playing:false, word:'brave', answer:null, source:'video', created:false,
      libraryFilter:'all', offline:JSON.parse(localStorage.getItem('lingomeo-offline')||'["offline"]'),
      notifications:true, toast:'', savedLessons:JSON.parse(localStorage.getItem('lingomeo-lessons')||'[]')
    };
    document.documentElement.dataset.theme=state.theme;

    const sources=[
      {id:'video',icon:'video',title:'Học qua video',desc:'Nghe thật, nói tự nhiên'},
      {id:'news',icon:'news',title:'Đọc tin ngắn',desc:'5 phút mỗi ngày'},
      {id:'offline',icon:'offline',title:'Bài học offline',desc:'Học khi mất mạng'},
      {id:'practice',icon:'practice',title:'Luyện tập',desc:'Ôn từ và ngữ pháp'}
    ];
    const builtInLessons=[
      {id:'video',type:'video',title:'At the coffee shop',meta:'Video · 8 phút',icon:'video'},
      {id:'news',type:'news',title:'A greener city',meta:'Bài đọc · A2',icon:'news'},
      {id:'offline',type:'offline',title:'Travel essentials',meta:'Offline · 12 phút',icon:'offline'},
      {id:'practice',type:'practice',title:'Daily routines',meta:'Luyện tập · 10 câu',icon:'practice'}
    ];

    function topHeader(title,subtitle='Học một chút, giỏi thêm mỗi ngày',back=false){
      return `<header class="app-header od-row detail-header">${back?`<button class="back-btn od-fixed" data-action="back" aria-label="Quay lại">${icon('arrow')}</button>`:`<span class="brand-mark od-fixed">${icon('cat','Biểu tượng Lingo Mèo')}</span>`}<div class="od-fill"><p class="eyebrow">${subtitle}</p><h1>${title}</h1></div>${back?'<span class="od-spacer od-touch" aria-hidden="true"></span>':`<button class="header-action od-fixed" data-action="notify" aria-label="Thông báo">${icon('bell')}</button>`}</header>`;
    }
    function tabs(){
      const items=[['home','home','Trang chủ'],['create','plus','Tạo bài'],['library','book','Thư viện'],['profile','user','Cá nhân']];
      return `<footer class="tab-bar od-grid" style="--od-cols:4;--od-gap:4px">${items.map(([id,ic,label])=>`<button class="tab-btn ${state.route===id?'active':''}" data-route="${id}" aria-label="${label}" aria-current="${state.route===id?'page':'false'}">${icon(ic)}<span>${label}</span></button>`).join('')}</footer>`;
    }
    function shell(content,title,subtitle,back=false,noTabs=false){
      return `<div class="app-shell od-screen">${topHeader(title,subtitle,back)}<section class="scroll-area od-scroll">${content}</section>${noTabs?'':tabs()}</div>`;
    }
    function home(){
      return shell(`<section class="hero"><div class="hero-copy"><span class="tag">Chuỗi 7 ngày</span><h2>Chào Linh! Sẵn sàng nói tiếng Anh?</h2><p>Hoàn thành một bài ngắn để giữ chuỗi học nhé.</p><button class="button" data-route="video">Học tiếp 8 phút</button></div>${mascot()}</section>
      <section class="section"><div class="section-heading od-row"><h2 class="od-fill">Bạn muốn học gì?</h2><button class="text-link od-fixed" data-route="library">Xem tất cả</button></div><div class="source-grid od-grid">${sources.map(s=>`<button class="source-card" data-route="${s.id}" data-source-type="${s.id}"><span class="source-icon">${icon(s.icon)}</span><h3>${s.title}</h3><p>${s.desc}</p></button>`).join('')}</div></section>
      <section class="section progress-card od-row" style="--od-gap:14px"><div class="progress-ring od-fixed" data-value="68%"></div><div class="od-fill"><span class="mini-label">Mục tiêu tuần</span><h3>4 trên 6 bài đã xong</h3><p style="margin:3px 0 0;color:var(--muted);font-size:13px">Thêm 2 bài để nhận huy hiệu Chăm chỉ.</p></div><span style="color:var(--accent-ink);background:var(--accent);padding:7px;border-radius:10px">${icon('flame')}</span></section>
      <section class="section"><div class="section-heading section-heading--split"><h2>Tiếp tục học</h2><span class="tag success">Đã lưu</span></div><div class="od-rail" style="margin-inline:-16px">${builtInLessons.slice(0,3).map(l=>`<button class="lesson-card od-row-top" data-route="${l.id}" style="text-align:left;color:var(--ink)"><span class="lesson-thumb od-fixed">${icon(l.icon)}</span><span class="od-fill"><span class="tag">A2</span><h3 style="margin-top:8px">${l.title}</h3><p>${l.meta}</p></span>${icon('chevron')}</button>`).join('')}</div></section>`, 'Lingo Mèo');
    }
    function video(){
      const defs={brave:['brave /breɪv/','dũng cảm'],journey:['journey /ˈdʒɜːni/','hành trình'],curious:['curious /ˈkjʊəriəs/','tò mò']};
      return shell(`<div class="video-stage"><svg class="video-art" viewBox="0 0 360 203" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><rect width="360" height="203" fill="#17384e"/><circle cx="300" cy="44" r="36" fill="#f5c842"/><path d="M0 150 74 87l53 42 48-70 71 74 47-40 67 58v52H0Z" fill="#55a579"/><path d="M0 173 84 121l61 44 64-53 71 55 42-31 38 28v39H0Z" fill="#9cdbbe"/></svg><button class="play-btn" data-action="play" aria-label="${state.playing?'Tạm dừng':'Phát video'}">${icon(state.playing?'pause':'play')}</button><div class="video-caption">${state.playing?'The brave traveler begins a new journey.':'Nhấn phát để nghe câu chuyện'}</div></div>
      <section class="section"><div class="section-heading od-row"><div class="od-fill"><span class="mini-label">VIDEO · BÀI 3</span><h2 style="margin-top:3px">The brave traveler</h2></div><button class="icon-btn od-fixed" data-action="offline-video" aria-label="Lưu bài học offline">${icon(state.offline.includes('video')?'check':'download')}</button></div><p style="color:var(--muted)">Luyện nghe câu chuyện ngắn và khám phá ba từ quan trọng.</p></section>
      <section class="section"><h2>Từ mới trong bài</h2><div class="od-cluster">${Object.keys(defs).map(w=>`<button class="word-chip ${state.word===w?'selected':''}" data-word="${w}">${w}</button>`).join('')}</div><div class="definition" style="margin-top:12px"><strong>${defs[state.word][0]}</strong><span>${defs[state.word][1]} · “She was brave enough to try.”</span></div></section>
      <section class="section"><button class="button primary block" data-route="practice">Luyện tập ngay</button></section>`, 'Học qua video','Nghe · Hiểu · Nói',true,true);
    }
    function news(){
      return shell(`<section class="article-cover"><div><span class="tag">TIN DỄ ĐỌC · A2</span><h2>A greener city</h2><p>How small gardens can make neighborhoods cooler.</p></div><svg viewBox="0 0 108 96" aria-label="Minh họa thành phố xanh" role="img"><g fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round"><path d="M9 88h92M19 88V42h27v46M56 88V21h33v67"/><path d="M27 52h10M27 64h10M65 34h14M65 47h14M65 60h14"/><path fill="#f5c842" d="M9 55c14-4 21 5 20 18-13 2-21-5-20-18ZM91 44c-13-1-20 7-17 19 13 0 20-7 17-19Z"/></g></svg></section>
      <section class="section article-body"><p>More people are growing plants on their balconies. These small gardens make the air feel <button data-word="fresh">fresh</button> and give birds a safe place to rest.</p><p>In summer, plants also help buildings stay <button data-word="cooler">cooler</button>. One neighborhood in Hà Nội started a shared garden where families learn and grow vegetables together.</p><div class="definition"><strong>${state.word==='fresh'?'fresh /freʃ/':state.word==='cooler'?'cooler /ˈkuːlə/':'Chạm vào từ gạch chân'}</strong><span>${state.word==='fresh'?'trong lành, tươi mới':state.word==='cooler'?'mát hơn':'Xem nghĩa tiếng Việt và cách đọc.'}</span></div></section>
      <section class="section"><button class="button primary block" data-route="practice">Kiểm tra đọc hiểu</button></section>`, 'Đọc tin ngắn','Đọc · Chạm từ · Hiểu',true,true);
    }
    function offline(){
      const downloaded=state.offline.includes('offline');
      return shell(`<section class="hero" style="min-height:166px"><div class="hero-copy"><span class="tag">KHÔNG CẦN MẠNG</span><h2>Travel essentials</h2><p>24 cụm từ cần thiết cho chuyến đi.</p></div><svg style="position:absolute;right:10px;bottom:6px;width:122px" viewBox="0 0 130 125" aria-label="Minh họa va-li du lịch" role="img"><g fill="none" stroke="#173143" stroke-width="3"><rect x="35" y="31" width="71" height="83" rx="14" fill="#ffd65a"/><path d="M54 31v-9c0-6 5-10 11-10h12c6 0 11 4 11 10v9M50 50v49M91 50v49M46 73h50"/><circle cx="52" cy="117" r="5" fill="#fff"/><circle cx="90" cy="117" r="5" fill="#fff"/></g></svg></section>
      <section class="section progress-card"><div class="od-row"><span class="source-icon od-fixed" style="margin:0">${icon(downloaded?'check':'cloud')}</span><div class="od-fill"><h3>${downloaded?'Sẵn sàng học offline':'Chưa tải xuống'}</h3><p style="margin:3px 0 0;color:var(--muted);font-size:13px">${downloaded?'18 MB · Cập nhật hôm nay':'18 MB · Khoảng 1 phút'}</p></div></div><button class="button ${downloaded?'secondary':'primary'} block" style="margin-top:14px" data-action="toggle-offline">${downloaded?'Xóa bản tải':'Tải bài học'}</button></section>
      <section class="section"><h2>Nội dung bài học</h2>${['At the airport · 8 cụm từ','Checking into a hotel · 7 cụm từ','Asking for directions · 9 cụm từ'].map((x,i)=>`<div class="setting-row od-row"><span class="tag od-fixed">${i+1}</span><div class="od-fill"><strong>${x.split(' · ')[0]}</strong><span class="helper">${x.split(' · ')[1]}</span></div>${icon('chevron')}</div>`).join('')}</section>`, 'Bài học offline','Học mọi lúc, mọi nơi',true,true);
    }
    function practice(){
      const answered=state.answer!==null;
      return shell(`<div class="od-row" style="margin-bottom:16px"><div class="od-fill"><span class="mini-label">CÂU 1 / 3</span><div class="loading-line" aria-label="Tiến độ 1 trên 3"><span style="width:33%;animation:none"></span></div></div><span class="tag">+10 điểm</span></div>
      <section class="practice-card"><span class="source-icon">${icon('practice')}</span><h2>Chọn câu đúng</h2><p>“Tôi thường đọc tin vào buổi sáng.”</p>${[['A','I usually read the news in the morning.'],['B','I am read news at morning.'],['C','I usually reading the news.']].map(([l,t],i)=>`<button class="quiz-option ${answered?(i===0?'correct':state.answer===i?'wrong':''):''}" data-answer="${i}" ${answered?'disabled':''}><span class="letter">${l}</span><span>${t}</span></button>`).join('')}${answered?`<div class="feedback" role="status"><strong>${state.answer===0?'Chính xác!':'Gần đúng rồi!'}</strong><span style="display:block;margin-top:4px">“Usually” đứng trước động từ thường “read”.</span></div>`:''}</section>
      <section class="section"><button class="button primary block" ${answered?'':'disabled'} data-action="next-question">${answered?'Câu tiếp theo':'Chọn một đáp án'}</button></section>`, 'Luyện tập','Ôn nhanh · Nhớ lâu',true,true);
    }
    function create(){
      if(state.created) return shell(`<section class="success-view"><div><span class="success-badge">${icon('check')}</span><h2 style="margin-top:22px">Bài học đã sẵn sàng!</h2><p>“English for my trip” đã được lưu vào thư viện của bạn.</p><button class="button primary" data-route="library">Mở thư viện</button><button class="button secondary" style="margin-left:8px" data-action="create-more">Tạo bài khác</button></div></section>`,'Tạo bài học','Biến nội dung bạn thích thành bài học');
      return shell(`<section class="form-card"><h2>1. Chọn nguồn học</h2><div class="od-stack">${[['video','video','Video YouTube'],['news','news','Bài báo hoặc văn bản'],['offline','offline','Ghi chú của riêng bạn']].map(([id,ic,label])=>`<button class="choice-card ${state.source===id?'selected':''}" data-source="${id}">${icon(ic)}<span class="od-fill"><strong>${label}</strong><span class="helper">${id==='video'?'Dán liên kết để lấy nội dung':id==='news'?'Thêm bài đọc và từ vựng':'Soạn bài để học khi không có mạng'}</span></span>${state.source===id?icon('check'):''}</button>`).join('')}</div></section>
      <section class="form-card section"><h2>2. Thông tin bài học</h2><form id="lesson-form" novalidate><div class="field"><label for="lesson-title">Tên bài học <span aria-hidden="true">*</span></label><input id="lesson-title" name="title" autocomplete="off" placeholder="Ví dụ: English for my trip" aria-describedby="title-help"/><span id="title-help" class="helper">Tên ngắn giúp bạn tìm bài dễ hơn.</span><span class="error" id="title-error" hidden>Hãy nhập tên bài học để tiếp tục.</span></div><div class="field"><label for="lesson-level">Trình độ</label><select id="lesson-level" name="level"><option>A1 · Mới bắt đầu</option><option selected>A2 · Cơ bản</option><option>B1 · Trung cấp</option></select></div><div class="field"><label for="lesson-note">Mục tiêu học</label><textarea id="lesson-note" name="note" placeholder="Ví dụ: Giao tiếp trong chuyến đi"></textarea></div><button class="button primary block" style="margin-top:18px" type="submit">Tạo bài học</button></form></section>`,'Tạo bài học','Biến nội dung bạn thích thành bài học');
    }
    function library(){
      const all=[...state.savedLessons.map((x,i)=>({id:'saved-'+i,type:'saved',title:x.title,meta:x.level+' · Vừa tạo',icon:'book'})),...builtInLessons];
      const shown=state.libraryFilter==='all'?all:state.libraryFilter==='offline'?all.filter(x=>state.offline.includes(x.id)||x.id==='offline'):all.filter(x=>x.type===state.libraryFilter);
      return shell(`<div class="library-filter od-rail">${[['all','Tất cả'],['video','Video'],['news','Bài đọc'],['offline','Offline'],['practice','Luyện tập']].map(([id,l])=>`<button class="filter-chip ${state.libraryFilter===id?'active':''}" data-filter="${id}">${l}</button>`).join('')}</div>${shown.length?`<div class="library-list">${shown.map(l=>`<a class="library-item" href="#${l.id}" data-route="${l.id.startsWith('saved')?'video':l.id}"><span class="thumb">${icon(l.icon)}</span><span><h3 class="od-truncate">${l.title}</h3><p>${l.meta}</p><span class="tag ${state.offline.includes(l.id)?'success':''}" style="margin-top:7px">${state.offline.includes(l.id)?'Đã tải':'Đang học'}</span></span><button class="download-btn" data-download="${l.id}" aria-label="${state.offline.includes(l.id)?'Xóa bản tải':'Tải bài '+l.title}">${icon(state.offline.includes(l.id)?'check':'download')}</button></a>`).join('')}</div>`:`<div class="empty-state" style="margin-top:16px">${icon('book')}<h2>Chưa có bài phù hợp</h2><p>Hãy đổi bộ lọc hoặc tạo bài học đầu tiên của bạn.</p><button class="button primary" data-route="create">Tạo bài học</button></div>`}`,'Thư viện của bạn','Bài đã lưu và tải xuống');
    }
    function profile(){
      const themes=[['sunshine','Nắng mai',['#f4faff','#1479b8','#f5c842']],['forest','Rừng xanh',['#f1fbf5','#237a58','#f2c44c']],['night','Đêm sao',['#0d2031','#63c3f2','#ffd65a']]];
      return shell(`<section class="profile-card profile-hero"><span class="avatar">${icon('cat','Ảnh đại diện mèo')}</span><h2 style="margin-bottom:2px">Linh Nguyễn</h2><p style="margin:0;color:var(--muted);font-size:13px">Trình độ A2 · Học từ tháng 6</p><div class="stat-grid od-grid"><div class="od-stat"><strong>7</strong><span>ngày liên tục</span></div><div class="od-stat"><strong>24</strong><span>bài đã học</span></div><div class="od-stat"><strong>86%</strong><span>độ chính xác</span></div></div></section>
      <section class="section profile-card"><div class="od-row"><span class="source-icon od-fixed" style="margin:0">${icon('palette')}</span><div class="od-fill"><h2 style="margin:0">Giao diện</h2><span class="helper">Chọn màu làm bạn dễ tập trung.</span></div></div><div class="theme-grid od-grid" style="margin-top:14px">${themes.map(([id,label,colors])=>`<button class="theme-swatch ${state.theme===id?'selected':''}" data-theme="${id}" aria-pressed="${state.theme===id}"><span class="theme-colors">${colors.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span>${label}</span></button>`).join('')}</div></section>
      <section class="section profile-card settings-card"><div class="settings-heading"><p class="eyebrow">TÙY CHỈNH</p><h2>Cài đặt học</h2></div><div class="settings-list"><div class="setting-row od-row"><div class="od-field od-fill"><strong>Nhắc lịch mỗi ngày</strong><span class="helper">20:00 · Theo giờ thiết bị</span></div><button class="toggle od-fixed" data-action="toggle-notify" aria-pressed="${state.notifications}" aria-label="Bật hoặc tắt nhắc lịch"></button></div><div class="setting-row od-row"><div class="od-field od-fill"><strong>Mục tiêu tuần</strong><span class="helper">6 bài mỗi tuần</span></div>${icon('chevron')}</div><div class="setting-row od-row"><div class="od-field od-fill"><strong>Trình độ hiện tại</strong><span class="helper">A2 · Cơ bản</span></div>${icon('chevron')}</div></div></section>`,'Hồ sơ','Tiến bộ của bạn');
    }
    function render(){
      const views={home,create,library,profile,video,news,offline,practice};
      app.innerHTML=(views[state.route]||home)()+ (state.toast?`<div class="toast" role="status">${icon('check')}<span>${state.toast}</span></div>`:'');
    }
    function navigate(route){ state.previous=state.route; state.route=route; state.toast=''; render(); }
    function showToast(message){ state.toast=message; render(); window.setTimeout(()=>{state.toast='';render()},1800); }
    app.addEventListener('click',e=>{
      const route=e.target.closest('[data-route]'); if(route){e.preventDefault();navigate(route.dataset.route);return;}
      const back=e.target.closest('[data-action="back"]'); if(back){navigate(state.previous==='home'?'home':state.previous);return;}
      const play=e.target.closest('[data-action="play"]'); if(play){state.playing=!state.playing;render();return;}
      const word=e.target.closest('[data-word]'); if(word){state.word=word.dataset.word;render();return;}
      const ans=e.target.closest('[data-answer]'); if(ans){state.answer=Number(ans.dataset.answer);render();return;}
      const next=e.target.closest('[data-action="next-question"]'); if(next){state.answer=null;showToast('Đã lưu kết quả · +10 điểm');return;}
      const source=e.target.closest('[data-source]'); if(source){state.source=source.dataset.source;render();return;}
      const filter=e.target.closest('[data-filter]'); if(filter){state.libraryFilter=filter.dataset.filter;render();return;}
      const theme=e.target.closest('[data-theme]'); if(theme){state.theme=theme.dataset.theme;document.documentElement.dataset.theme=state.theme;localStorage.setItem('lingomeo-theme',state.theme);showToast('Đã đổi giao diện');return;}
      const download=e.target.closest('[data-download]'); if(download){e.preventDefault();e.stopPropagation();toggleOffline(download.dataset.download);return;}
      const offline=e.target.closest('[data-action="toggle-offline"]'); if(offline){toggleOffline('offline');return;}
      const videoOffline=e.target.closest('[data-action="offline-video"]'); if(videoOffline){toggleOffline('video');return;}
      const notify=e.target.closest('[data-action="notify"]'); if(notify){showToast('Bạn đã hoàn thành mục tiêu hôm nay!');return;}
      const toggle=e.target.closest('[data-action="toggle-notify"]'); if(toggle){state.notifications=!state.notifications;showToast(state.notifications?'Đã bật nhắc lịch':'Đã tắt nhắc lịch');return;}
      const more=e.target.closest('[data-action="create-more"]'); if(more){state.created=false;render();}
    });
    app.addEventListener('submit',e=>{
      if(e.target.id!=='lesson-form')return; e.preventDefault(); const title=e.target.title.value.trim(); const error=document.getElementById('title-error');
      if(!title){error.hidden=false;e.target.title.setAttribute('aria-invalid','true');e.target.title.focus();return;}
      state.savedLessons.unshift({title,level:e.target.level.value.split(' · ')[0]}); localStorage.setItem('lingomeo-lessons',JSON.stringify(state.savedLessons)); state.created=true; render();
    });
    function toggleOffline(id){ const idx=state.offline.indexOf(id); if(idx>=0)state.offline.splice(idx,1); else state.offline.push(id); localStorage.setItem('lingomeo-offline',JSON.stringify(state.offline)); showToast(idx>=0?'Đã xóa bản tải':'Đã tải để học offline'); }
    render();
  </script>
</body>
</html>
