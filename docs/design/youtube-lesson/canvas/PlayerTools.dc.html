<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Công cụ luyện nghe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0}
.lb{--background:#fcfae6;--surface:#ffffff;--surfaceLow:#f6f4e1;--surfaceContainer:#f0efdb;--surfaceHigh:#ebe9d5;--outlineVariant:#bacac5;--outline:#6b7a76;--primary:#006b5f;--primaryContainer:#2dd4bf;--onPrimaryContainer:#00574d;--accentSoft:#ddf8f5;--favorite:#a93349;--secondarySoft:rgba(254,116,136,.16);--tertiary:#6d5e00;--tertiarySoft:rgba(255,226,76,.22);--danger:#ba1a1a;--text-primary:#1c1c10;--text-secondary:#3c4a46;--text-muted:#5f6e6a;--onPrimary:#ffffff;--shadow:0 4px 20px rgba(20,28,50,.06);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--text-primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0}
.ms.f{font-variation-settings:"FILL" 1}
button,input{font:inherit}
button{cursor:pointer}
a{color:#006b5f}a:hover{color:#00574d}
</style>
</helmet>
<div class="lb" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--background)">
  <dc-import name="Player" hint-size="390px,844px"></dc-import>
  <div style="position: absolute; left: 0; right: 0; top: 275px; bottom: 0; background: rgba(0,0,0,.4)"></div>
  <section role="dialog" aria-label="Công cụ luyện nghe" style="position: absolute; left: 0; right: 0; top: 283px; bottom: 0; background: var(--surface); border-radius: 32px 32px 0 0; display: flex; flex-direction: column; overflow: hidden">
    <div style="display: flex; justify-content: center; padding-top: 8px"><span style="width: 36px; height: 4px; border-radius: 2px; background: var(--outlineVariant)"></span></div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 6px 8px 4px 20px">
      <h2 style="flex-grow: 1; margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Công cụ luyện nghe</h2>
      <button aria-label="Đóng" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; color: var(--text-primary); display: grid; place-items: center"><span class="ms">close</span></button>
    </div>

    <div style="flex-grow: 1; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 600">Lặp mỗi câu</span>
        <div role="radiogroup" aria-label="Lặp mỗi câu" style="display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px">
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--text-primary)">Tắt</button>
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--text-primary)">1×</button>
          <button role="radio" aria-checked="true" style="height: 40px; border: 0; background: var(--primary); border-radius: 20px; font-size: 14px; font-weight: 700; color: var(--onPrimary)">3×</button>
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--text-primary)">5×</button>
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 16px; font-weight: 600; color: var(--text-primary)">∞</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; align-items: baseline; gap: 8px"><span style="font-size: 14px; font-weight: 600; flex-grow: 1">Lặp đoạn A–B</span><span style="font-size: 13px; color: var(--tertiary); font-weight: 600">Đang lặp câu 3–5</span></div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px">
          <button style="height: 44px; border: 1px solid var(--tertiary); background: var(--tertiarySoft); border-radius: 22px; font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms" style="font-size: 18px">flag</span>A · câu 3</button>
          <button style="height: 44px; border: 1px solid var(--tertiary); background: var(--tertiarySoft); border-radius: 22px; font-size: 14px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; justify-content: center; gap: 4px"><span class="ms" style="font-size: 18px">sports_score</span>B · câu 5</button>
          <button style="height: 44px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 22px; font-size: 14px; font-weight: 600; color: var(--text-primary)">Xoá A–B</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; font-weight: 600">Tốc độ phát</span>
        <div role="radiogroup" aria-label="Tốc độ phát" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--text-primary)">0.5×</button>
          <button role="radio" aria-checked="true" style="height: 40px; border: 0; background: var(--primary); border-radius: 20px; font-size: 14px; font-weight: 700; color: var(--onPrimary)">0.75×</button>
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--text-primary)">1×</button>
          <button role="radio" aria-checked="false" style="height: 40px; border: 1px solid var(--outlineVariant); background: var(--surface); border-radius: 20px; font-size: 14px; font-weight: 600; color: var(--text-primary)">1.25×</button>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; gap: 0; border-top: 1px solid var(--surfaceHigh)">
        <label for="tg-autoscroll" style="display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--surfaceHigh)">
          <span class="ms" style="font-size: 22px; color: var(--text-muted)">swipe_right</span>
          <span style="flex-grow: 1; font-size: 15px">Tự chuyển thẻ theo video</span>
          <input id="tg-autoscroll" type="checkbox" checked style="width: 22px; height: 22px; accent-color: #006b5f">
        </label>
        <a href="#" style="display: flex; align-items: center; gap: 12px; min-height: 52px; text-decoration: none; color: var(--text-primary)">
          <span class="ms" style="font-size: 22px; color: var(--text-muted)">keyboard</span>
          <span style="flex-grow: 1; display: flex; flex-direction: column"><span style="font-size: 15px">Chép chính tả</span><span style="font-size: 13px; color: var(--text-muted)">Nghe câu đang phát rồi gõ lại</span></span>
          <span class="ms" style="font-size: 22px; color: var(--text-muted)">chevron_right</span>
        </a>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
