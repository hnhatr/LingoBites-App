<head>

<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0}
.lb{--background:#fcfae6;--surface:#ffffff;--surfaceLow:#f6f4e1;--surfaceContainer:#f0efdb;--surfaceHigh:#ebe9d5;--outlineVariant:#bacac5;--outline:#6b7a76;--primary:#006b5f;--primaryContainer:#2dd4bf;--onPrimaryContainer:#00574d;--accentSoft:#ddf8f5;--favorite:#a93349;--secondarySoft:rgba(254,116,136,.16);--tertiary:#6d5e00;--tertiarySoft:rgba(255,226,76,.22);--danger:#ba1a1a;--text-primary:#1c1c10;--text-secondary:#3c4a46;--text-muted:#5f6e6a;--onPrimary:#ffffff;--shadow:0 4px 20px rgba(20,28,50,.06);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--text-primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0}
.ms.f{font-variation-settings:"FILL" 1}
button,input{font:inherit}
button{cursor:pointer}
a{color:#006b5f}a:hover{color:#00574d}
</style>
</helmet>
<div class="lb" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--background); display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; min-height: 56px; box-sizing: border-box">
    <button aria-label="Đóng" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; color: var(--text-primary); display: grid; place-items: center"><span class="ms">close</span></button>
    <span style="flex-grow: 1"></span>
  </div>

  <div style="flex-grow: 1; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding-top: 16px">
      <span style="width: 96px; height: 96px; border-radius: 48px; background: var(--primaryContainer); color: var(--onPrimaryContainer); display: grid; place-items: center"><span class="ms f" style="font-size: 52px">celebration</span></span>
      <h2 style="margin: 0; font-size: 26px; line-height: 32px; font-weight: 700">Bạn đã học xong bài này</h2>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-secondary)">How to order coffee in English</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <div style="background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums">18</span>
        <span style="font-size: 13px; color: var(--text-muted)">câu đã nghe</span>
      </div>
      <div style="background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 24px; font-weight: 700; color: var(--primary); font-variant-numeric: tabular-nums">5</span>
        <span style="font-size: 13px; color: var(--text-muted)">từ đã lưu</span>
      </div>
      <div style="background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <span style="font-size: 24px; font-weight: 700; color: var(--favorite); font-variant-numeric: tabular-nums">2</span>
        <span style="font-size: 13px; color: var(--text-muted)">câu đã lưu</span>
      </div>
    </div>

    <div style="background: var(--accentSoft); border-radius: 24px; padding: 16px; display: flex; gap: 12px; align-items: center">
      <span class="ms" style="font-size: 28px; color: var(--primary)">style</span>
      <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 15px; font-weight: 700">Ôn 5 từ vừa lưu</span>
        <span style="font-size: 13px; line-height: 18px; color: var(--text-secondary)">Các từ đã vào bộ thẻ ôn tập hằng ngày.</span>
      </div>
    </div>
  </div>

  <div style="padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 24px; background: var(--primary); color: var(--onPrimary); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" style="font-size: 20px">style</span>Ôn từ đã lưu</button>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
      <button style="height: 52px; border: 1px solid var(--primary); border-radius: 24px; background: var(--surface); color: var(--primary); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="font-size: 20px">replay</span>Xem lại</button>
      <button style="height: 52px; border: 0; border-radius: 24px; background: var(--surfaceHigh); color: var(--primary); font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 6px"><span class="ms" style="font-size: 20px">add_link</span>Video khác</button>
    </div>
  </div>
</div>
</x-dc>
