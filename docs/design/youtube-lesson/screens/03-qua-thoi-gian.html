<!doctype html>
<html lang="vi">
<head>
<!--
  LingoBites · Bài học YouTube · 03 · Mất lâu hơn dự kiến
  Nguồn: canvas/CreateTimeout.dc.html (bản xuất HTML độc lập, 390×844).
  Biến CSS trùng tên key trong theme: var(--accentSoft) = theme.colors.accentSoft,
  var(--text-muted) = theme.colors.text.muted. Bảng đầy đủ: ../tokens.json
  Nội dung (tên video, câu, số liệu) là dữ liệu mẫu.
-->
<meta charset="utf-8">
<title>Mất lâu hơn dự kiến</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=block">
<style>
body{margin:0}
.lb{--background:#fcfae6;--surface:#ffffff;--surfaceLow:#f6f4e1;--surfaceContainer:#f0efdb;--surfaceHigh:#ebe9d5;--outlineVariant:#bacac5;--outline:#6b7a76;--primary:#006b5f;--primaryContainer:#2dd4bf;--onPrimaryContainer:#00574d;--accentSoft:#ddf8f5;--favorite:#a93349;--secondarySoft:rgba(254,116,136,.16);--tertiary:#6d5e00;--tertiarySoft:rgba(255,226,76,.22);--danger:#ba1a1a;--text-primary:#1c1c10;--text-secondary:#3c4a46;--text-muted:#5f6e6a;--onPrimary:#ffffff;--shadow:0 4px 20px rgba(20,28,50,.06);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:var(--text-primary)}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0}
.ms.f{font-variation-settings:"FILL" 1}
button,input{font:inherit}
button{cursor:pointer}
a{color:#006b5f}a:hover{color:#00574d}
</style>
</head>
<body>

<div class="lb" style="width: 390px; height: 844px; box-sizing: border-box; background: var(--background); display: flex; flex-direction: column; overflow: hidden">

  <div style="display: flex; align-items: center; gap: 4px; padding: 8px 8px 8px 4px; min-height: 56px; box-sizing: border-box">
    <button aria-label="Quay lại" style="width: 44px; height: 44px; border: 0; background: transparent; border-radius: 22px; color: var(--text-primary); display: grid; place-items: center"><span class="ms">arrow_back</span></button>
    <h1 style="flex-grow: 1; margin: 0; font-size: 18px; line-height: 24px; font-weight: 600">Học từ YouTube</h1>
  </div>

  <div style="flex-grow: 1; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; align-items: center; gap: 12px; background: var(--surface); border-radius: 18px; padding: 10px; box-shadow: var(--shadow)">
      <div style="width: 96px; height: 54px; border-radius: 10px; background: #1c1c10; display: grid; place-items: center; color: #ffffff; flex-shrink: 0"><span class="ms f" style="font-size: 22px">play_arrow</span></div>
      <div style="display: flex; flex-direction: column; gap: 2px; min-width: 0">
        <span style="font-size: 14px; font-weight: 600">Video YouTube</span>
        <span style="font-size: 13px; color: var(--text-muted)">youtu.be/Ks-_Mh1QhMc</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; padding: 36px 8px 0">
      <span style="width: 72px; height: 72px; border-radius: 36px; background: var(--tertiarySoft); color: var(--tertiary); display: grid; place-items: center"><span class="ms" style="font-size: 36px">hourglass_top</span></span>
      <h2 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">Mất lâu hơn dự kiến</h2>
      <p style="margin: 0; font-size: 15px; line-height: 22px; color: var(--text-secondary); max-width: 300px">Máy chủ vẫn đang xử lý video này. Yêu cầu của bạn được giữ nguyên, kiểm tra lại sẽ không tạo bài trùng.</p>
    </div>

    <div style="display: flex; gap: 10px; align-items: flex-start; background: var(--surfaceLow); border-radius: 18px; padding: 12px 14px; font-size: 14px; line-height: 20px; color: var(--text-secondary)">
      <span class="ms" style="font-size: 20px; color: var(--text-muted)">info</span>
      <span>Video dài hoặc nhiều câu thường cần thêm thời gian.</span>
    </div>
  </div>

  <div style="padding: 12px 16px 28px; display: flex; flex-direction: column; gap: 10px">
    <button style="width: 100%; height: 52px; border: 0; border-radius: 24px; background: var(--primary); color: var(--onPrimary); font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px"><span class="ms" style="font-size: 20px">refresh</span>Kiểm tra lại</button>
    <button style="width: 100%; height: 52px; border: 0; border-radius: 24px; background: var(--surfaceHigh); color: var(--primary); font-size: 16px; font-weight: 700">Quay lại sau</button>
  </div>
</div>
</body>
</html>
